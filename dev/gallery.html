<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Pet gallery</title>
<link rel="stylesheet" href="../src/renderer/shared/pet-art.css">
<style>
  body { margin: 0; padding: 16px; font: 12px -apple-system, "PingFang SC", sans-serif; background: #fdf6f8; color: #6b5060; }
  h2 { margin: 18px 0 6px; font-size: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
