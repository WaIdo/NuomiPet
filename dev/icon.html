<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../src/renderer/shared/pet-art.css">
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  * { animation-play-state: paused !important; animation-delay: 0s !important; }
  #root, #root > svg { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
import { petSVG } from '../src/renderer/shared/pet-art.js';
const q = new URLSearchParams(location.search);
const kind = q.get('kind');
const root = document.getElementById('root');
const pet = (look, x, y, w, viewBox = '0 0 200 200') => {
  const holder = document.createElement('div');
  holder.innerHTML = petSVG(look);
  const svg = holder.firstElementChild;
  svg.setAttribute('x', x); svg.setAttribute('y', y); svg.setAttribute('width', w); svg.setAttribute('height', w);
  svg.setAttribute('viewBox', viewBox);
  return svg;
};
const NS = 'http://www.w3.org/2000/svg';
if (kind === 'app') {
  root.innerHTML = `<svg viewBox="0 0 1024 1024" xmlns="${NS}">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0" stop-color="#FFE9F1"/><stop offset=".55" stop-color="#FFD2E2"/><stop offset="1" stop-color="#FFB7CF"/>
      </linearGradient>
      <radialGradient id="glow" cx="28%" cy="18%" r="75%">
        <stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
      <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#C2507A" flood-opacity=".28"/>
      </filter>
      <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    </defs>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#sh)"/>
    <g clip-path="url(#sq)">
      <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
      <circle cx="820" cy="250" r="120" fill="#fff" opacity=".22"/>
      <circle cx="210" cy="820" r="160" fill="#fff" opacity=".16"/>
      <ellipse cx="512" cy="846" rx="330" ry="40" fill="#E68AAE" opacity=".35"/>
    </g>
    <g fill="#fff">
      <path d="M770 250c5 36 20 52 56 58-36 6-51 22-56 58-5-36-20-52-56-58 36-6 51-22 56-58z" opacity=".95"/>
      <path d="M250 300c3 22 12 31 34 34-22 3-31 12-34 34-3-22-12-31-34-34 22-3 31-12 34-34z" opacity=".9"/>
      <path d="M800 640c3 20 11 28 30 31-19 3-27 11-30 31-3-20-11-28-30-31 19-3 27-11 30-31z" opacity=".85"/>
    </g>
    <path d="M232 520c-8-6-40-30-40-52 0-12 9-21 20-21 7 0 13 4 16 9 3-5 9-9 16-9 11 0 20 9 20 21 0 22-32 46-40 52z" fill="#FF7EA8" opacity=".9"/>
  </svg>`;
  const outer = root.firstElementChild;
  const p = pet({ species: q.get('sp') || 'cat', color: q.get('c') || 'milk', accessory: q.get('a') || 'bow' }, 172, 190, 680, '0 0 200 200');
  p.querySelector('.p-shadow').remove();
  outer.append(p);
} else if (kind === 'trayTemplate') {
  root.innerHTML = `<svg viewBox="0 0 32 32" xmlns="${NS}">
    <defs><mask id="m"><rect width="32" height="32" fill="#fff"/>
      <ellipse cx="10.8" cy="19" rx="2.7" ry="3.3" fill="#000"/><ellipse cx="21.2" cy="19" rx="2.7" ry="3.3" fill="#000"/>
      <path d="M13.9 23.6 q1 1.4 2.1 0.2 q1 1.2 2.1 -0.2" stroke="#000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </mask></defs>
    <g mask="url(#m)" fill="#000">
      <path d="M3.4 16.5 Q3 8 5.4 3.6 Q6.2 2.4 7.4 3.2 L13.6 8.4 Z"/>
      <path d="M28.6 16.5 Q29 8 26.6 3.6 Q25.8 2.4 24.6 3.2 L18.4 8.4 Z"/>
      <path d="M16 7.2 C24.6 7.2 30 12.8 30 20 C30 26.4 25.4 29.4 20.4 29.4 L11.6 29.4 C6.6 29.4 2 26.4 2 20 C2 12.8 7.4 7.2 16 7.2 Z"/>
    </g>
  </svg>`;
} else if (kind === 'tray') {
  root.innerHTML = `<svg viewBox="0 0 200 200" xmlns="${NS}"></svg>`;
  const p = pet({ species: 'cat', color: 'sakura', accessory: 'none' }, 0, 0, 200, '18 30 164 164');
  p.querySelector('.p-shadow').remove();
  p.querySelector('.p-tail')?.remove();
  p.querySelector('.p-whiskers')?.remove();
  p.querySelectorAll('.p-blob, .ear path.hit').forEach((el) => el.setAttribute('stroke-width', q.get('sw') || '7'));
  root.firstElementChild.replaceWith(p);
}
window.__done = true;
</script>
</body>
</html>
